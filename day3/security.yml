# Day 3 pipeline: six security gates. Copy to .github/workflows/security.yml
name: Security

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: 1 Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          detect --source /repo --no-git --no-banner --redact -v

  sast:
    name: 2 SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >
          docker run --rm -v "$PWD:/src" semgrep/semgrep
          semgrep scan --config /src/day3/semgrep-rules.yml --error --metrics off /src/site

  sca:
    name: 3 SCA (trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest
          fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /src

  image:
    name: 4 Image scan (trivy image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t hello-devops:scan .
      - run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
          image --severity CRITICAL --ignore-unfixed --exit-code 1 hello-devops:scan

  iac:
    name: 5 IaC scan (trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest
          config --severity HIGH,CRITICAL --exit-code 1 /src/infra

  dast:
    name: 6 DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t hello-devops:scan .
      - run: docker run -d --name web -p 8080:80 hello-devops:scan
      - run: >
          docker run --rm --network host --user root -v "$PWD/day3:/zap/wrk"
          ghcr.io/zaproxy/zaproxy:stable
          zap-baseline.py -t http://localhost:8080 -c zap-rules.tsv -I
